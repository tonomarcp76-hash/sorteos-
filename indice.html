<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Plataforma de Sorteos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1a237e, #283593, #3949ab); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; }
        header h1 { font-size: 2.5rem; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        h2 { color: #ffd700; margin-bottom: 25px; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: rgba(255,255,255,0.9); font-size: 15px; color: #1a237e; }
        button { width: 100%; padding: 14px 25px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: all 0.3s; }
        button:hover { transform: translateY(-2px); }
        .btn-oro { background: linear-gradient(90deg, #ffd700, #ffc107); color: #1a237e; }
        .mensaje { padding: 15px; border-radius: 8px; margin-top: 20px; display: none; text-align: center; }
        .exito { background: rgba(76,175,80,0.3); display: block; }
        .error { background: rgba(244,67,54,0.3); display: block; }
        code { background: #000; padding: 4px 8px; border-radius: 4px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎰 CREAR SORTEO</h1>
    </header>

    <div class="card">
        <h2>➕ Nuevo Sorteo</h2>
        
        <label>Nombre del Sorteo:</label>
        <input type="text" id="s-nombre" placeholder="Ej: Sorteo de Aniversario">
        
        <label>Premio:</label>
        <input type="text" id="s-premio" placeholder="Ej: $5,000 en efectivo">
        
        <label>Descripción / Bases:</label>
        <textarea id="s-desc" rows="4" placeholder="Requisitos, fechas, condiciones..."></textarea>
        
        <label>Cantidad de Ganadores:</label>
        <input type="number" id="s-ganadores" value="1" min="1" max="5">
        
        <button class="btn-oro" onclick="crearSorteo()">🚀 Crear Sorteo</button>
        
        <div id="msg-crear" class="mensaje"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBjNhAZE_Rkt-K3PU3wq6g-0K3XX6j6j4",
  authDomain: "sorteos-b4ee2.firebaseapp.com",
  projectId: "sorteos-b4ee2",
  storageBucket: "sorteos-b4ee2.appspot.com",
  messagingSenderId: "473130628058",
  appId: "1:473130628058:web:4d6b89989392b3c332c6e3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function generarCodigo() {
  return 'SOR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
}

async function crearSorteo() {
  const nombre = document.getElementById('s-nombre').value.trim();
  const premio = document.getElementById('s-premio').value.trim();
  const desc = document.getElementById('s-desc').value.trim();
  const cantGanadores = parseInt(document.getElementById('s-ganadores').value);
  const msg = document.getElementById('msg-crear');
  
  if (!nombre || !premio) {
    msg.textContent = '⚠️ Completa nombre y premio';
    msg.className = 'mensaje error';
    return;
  }

  const nuevo = {
    nombre, premio, descripcion: desc, cantGanadores,
    codigo: generarCodigo(), estado: 'abierto',
    participantes: [], ganadores: [],
    fechaCreacion: new Date().toISOString()
  };

  try {
    await db.collection('sorteos').add(nuevo);
    msg.innerHTML = `✅ <strong>Creado con éxito!</strong><br><br>Código para compartir:<br><code>${nuevo.codigo}</code>`;
    msg.className = 'mensaje exito';
    document.getElementById('s-nombre').value = '';
    document.getElementById('s-premio').value = '';
    document.getElementById('s-desc').value = '';
  } catch (err) {
    msg.textContent = '❌ Error: ' + err.message;
    msg.className = 'mensaje error';
  }
}
</script>

</body>
</html>
